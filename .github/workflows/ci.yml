name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - edge
    paths:
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - "tests/**"
      - "tools/governance/**"
      - build.rs
      - "rust-toolchain*"
      - docs/CONTRACTS.md
      - docs/CRATES.md
      - .beads/issues.jsonl
      - .agent-protocols.json
      - .agent-protocols.local.md
      - .agent-protocols.exceptions.json
      - AGENTS.md
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.15.2
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          printf '%s  %s\n' \
            '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' \
            "$RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/zig.tar.xz" \
            --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Log toolchain versions
        run: |
          rustc --version --verbose
          cargo --version --verbose
          zig version

      - name: Install Starcompass
        run: |
          cargo install --locked \
            --git https://github.com/luccahuguet/starcompass.git \
            --rev 95c29fa76a971726b65e1d1dc06c518d525c46a2 \
            --root "$RUNNER_TEMP/starcompass"

      - name: Verify
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace
          cargo test --locked --workspace
          cargo run --locked --quiet -p orbit-governance -- .
          "$RUNNER_TEMP/starcompass/bin/starcompass" check-consumer \
            --overlay .agent-protocols.local.md \
            --exceptions .agent-protocols.exceptions.json \
            --manifest .agent-protocols.json \
            --agents AGENTS.md
          cargo clippy --locked --workspace --all-targets -- -D warnings

  macos:
    if: github.event_name == 'workflow_dispatch'
    name: Rust (Apple Silicon macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.15.2
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          printf '%s  %s\n' \
            '3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b' \
            "$RUNNER_TEMP/zig.tar.xz" | shasum --algorithm 256 --check
          tar --extract --xz --file "$RUNNER_TEMP/zig.tar.xz" \
            --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"

      - name: Log toolchain versions
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          rustc --version --verbose
          cargo --version --verbose
          zig version

      - name: Verify native runtime
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace
